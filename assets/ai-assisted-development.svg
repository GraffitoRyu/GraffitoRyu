<svg width="846" height="286" viewBox="0 0 846 286" role="img" aria-labelledby="title desc" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title id="title">Agent-driven development workflow</title>
  <desc id="desc">Plan leads to Execute, Verify, and Decide. Verification can return to Execute for correction or to Plan for reassessment. Plan can lead directly to Decide to defer or make no change. Dependencies inform the workflow.</desc>
