<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">AI-assisted development workflow</title>
  <desc id="desc">A four-step workflow: Context, Delegate, Verify, Integrate.</desc>
  <defs>
    <style>
      .bg{fill:#ffffff;stroke:#d0d7de}.title,.label,.body,.step,.footer{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#1f2328}.muted{fill:#57606a}.card{fill:#f6f8fa;stroke:#d8dee4}.accent{fill:#0969da}.line{stroke:#afb8c1}
      @media(prefers-color-scheme:dark){.bg{fill:#0d1117;stroke:#30363d}.title,.label,.body,.step,.footer{fill:#e6edf3}.muted{fill:#8b949e}.card{fill:#161b22;stroke:#30363d}.accent{fill:#58a6ff}.line{stroke:#484f58}}
    </style>
  </defs>

  <rect class="bg" x="0.5" y="0.5" width="899" height="259" rx="14"/>

  <text class="title" x="28" y="38" font-size="20" font-weight="700">AI-assisted development</text>
  <text class="muted" x="28" y="59" font-size="12">How I work with agents while keeping context, judgment, and verification explicit.</text>

  <line class="line" x1="115" y1="109" x2="785" y2="109" stroke-width="2"/>

  <g transform="translate(28 78)">
    <rect class="card" x="0" y="0" width="190" height="112" rx="10"/>
    <circle class="accent" cx="24" cy="28" r="12"/>
    <text x="24" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">01</text>
    <text class="label" x="46" y="32" font-size="14" font-weight="700">CONTEXT</text>
    <text class="body muted" x="16" y="61" font-size="12">Domain · Constraints</text>
    <text class="body muted" x="16" y="80" font-size="12">Conventions · History</text>
  </g>

  <g transform="translate(246 78)">
    <rect class="card" x="0" y="0" width="190" height="112" rx="10"/>
    <circle class="accent" cx="24" cy="28" r="12"/>
    <text x="24" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">02</text>
    <text class="label" x="46" y="32" font-size="14" font-weight="700">DELEGATE</text>
    <text class="body muted" x="16" y="61" font-size="12">Implementation · Refactor</text>
    <text class="body muted" x="16" y="80" font-size="12">Review · Repetitive work</text>
  </g>

  <g transform="translate(464 78)">
    <rect class="card" x="0" y="0" width="190" height="112" rx="10"/>
    <circle class="accent" cx="24" cy="28" r="12"/>
    <text x="24" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">03</text>
    <text class="label" x="46" y="32" font-size="14" font-weight="700">VERIFY</text>
    <text class="body muted" x="16" y="61" font-size="12">Types · Tests · Runtime</text>
    <text class="body muted" x="16" y="80" font-size="12">Interaction · Review</text>
  </g>

  <g transform="translate(682 78)">
    <rect class="card" x="0" y="0" width="190" height="112" rx="10"/>
    <circle class="accent" cx="24" cy="28" r="12"/>
    <text x="24" y="32" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">04</text>
    <text class="label" x="46" y="32" font-size="14" font-weight="700">INTEGRATE</text>
    <text class="body muted" x="16" y="61" font-size="12">Codebase · Automation</text>
    <text class="body muted" x="16" y="80" font-size="12">Git safety · Handoff</text>
  </g>

  <text class="footer" x="450" y="224" text-anchor="middle" font-size="13" font-weight="600">Understand → Delegate → Verify → Integrate</text>
  <text class="muted" x="450" y="244" text-anchor="middle" font-size="11">Agent workflows · Runtime verification · Automation</text>
</svg>
