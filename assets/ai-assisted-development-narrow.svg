    rect[fill="#10161D"]{fill:#f6f8fa}rect[stroke]{stroke:#d0d7de}
    rect[fill="#0D1117"]{fill:#fff}
    @media(prefers-color-scheme:dark){
      text{fill:#ADBAC7}text[font-size="18"]{fill:#F0F6FC}
      path[stroke]{stroke:#8B949E}path[fill]{fill:#8B949E}
      rect[fill="#10161D"]{fill:#10161D}rect[stroke]{stroke:#3D444D}
      rect[fill="#0D1117"]{fill:#0D1117}
    }
  </style>
